version: '3.8'

services:
  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/music-order-app
      - JWT_SECRET=your_jwt_secret
      - ADMIN_USERNAME=your_admin_username
      - ADMIN_PASSWORD=your_admin_password
      - CLIENT_URL=your_client_url
      - SOCKET_URL=your_socket_url
      - SONG_SKIP_PC_THRESHOLD=100
      - WORDCHAIN_TURN_MS=8000
      - WORDCHAIN_IDLE_MS=30000
      - WORDCHAIN_BETWEEN_ROUNDS_MS=5000
      - WORDCHAIN_ROUND_PAYOUT_CAP=60
      - WORDCHAIN_DAILY_PAYOUT_CAP=250
      - XIANGQI_STAKE_PC=10
      - XIANGQI_REWARD_EASY=15
      - XIANGQI_REWARD_MEDIUM=38
      - XIANGQI_REWARD_HARD=66
      - XIANGQI_DAILY_REWARD_CAP=500
      - XIANGQI_TIME_EASY_SECONDS=40
      - XIANGQI_TIME_MEDIUM_SECONDS=60
      - XIANGQI_TIME_HARD_SECONDS=90
      - XIANGQI_RECENT_PUZZLES=20
      - XIANGQI_ENGINE_WORKERS=2
      - XIANGQI_ENGINE_MOVE_MS=800
      - XIANGQI_ENGINE_JOB_TIMEOUT_MS=3000
      - XIANGQI_ENGINE_MAX_RETRIES=1
      - YOUTUBE_API_KEY=your_youtube_api_key
      - WC2026_API_KEY=your_wc2026_api_key
      - WEATHER_API_KEY=
      - WEATHER_LOCATION=
      - VIENEU_TTS_URL=http://vieneu-tts:8100
      - VIENEU_TTS_VOICE=Ngọc Lan
      - VIENEU_TTS_CACHE_VERSION=vieneu-preset-v1
      - VIENEU_TTS_ENABLED=true
      - VIENEU_TTS_TIMEOUT=180000
      - VIENEU_TTS_PRIMARY_TIMEOUT=30000
      - VIENEU_TTS_SYNC_WAIT_MS=2500
      - VIENEU_TTS_HEALTH_TIMEOUT=5000
      - VIENEU_TTS_CACHE_MAX_FILES=1000
      - VIENEU_TTS_CACHE_MAX_AGE_DAYS=30
      - VIENEU_TTS_SPEECH_MAX_CHARS=200
      - VIENEU_TTS_QUEUE_MAX_SIZE=50
      - VIENEU_TTS_WARM_QUEUE_CONCURRENCY=1
      - VIENEU_TTS_RATE_MAX_REQUESTS=20
      - VIENEU_TTS_RATE_WINDOW_MS=60000
      - EDGE_TTS_ENABLED=true
      - EDGE_TTS_VOICE=${EDGE_TTS_VOICE:-vi-VN-NamMinhNeural}
      - EDGE_TTS_RATE=${EDGE_TTS_RATE:-+0%}
      - EDGE_TTS_VOLUME=${EDGE_TTS_VOLUME:-+0%}
      - EDGE_TTS_PITCH=${EDGE_TTS_PITCH:-+0Hz}
      - EDGE_TTS_TIMEOUT=15000
    ports:
      - '5800:5000'

  vieneu-tts:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    environment:
      - VIENEU_HOST=0.0.0.0
      - VIENEU_PORT=8100
      - VIENEU_APPLY_WATERMARK=false
      - VIENEU_INFER_MAX_CHARS=200
      - VIENEU_INFER_MAX_NEW_FRAMES=180
      - VIENEU_INFER_TEMPERATURE=0.65
      - VIENEU_INFER_TOP_K=10
      - VIENEU_INFER_TOP_P=0.85
      - VIENEU_INFER_REPETITION_PENALTY=1.15
      - EDGE_TTS_VOICE=${EDGE_TTS_VOICE:-vi-VN-NamMinhNeural}
      - EDGE_TTS_RATE=${EDGE_TTS_RATE:-+0%}
      - EDGE_TTS_VOLUME=${EDGE_TTS_VOLUME:-+0%}
      - EDGE_TTS_PITCH=${EDGE_TTS_PITCH:-+0Hz}
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - NUMEXPR_NUM_THREADS=4
    ports:
      - '8100:8100'
    volumes:
      - tts_models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=your_api_url
        - VITE_SOCKET_URL=your_socket_url
    ports:
      - '3800:80'

networks:
  music-order-network:
    driver: bridge

volumes:
  mongodb_data:
  tts_models:
