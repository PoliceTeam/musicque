# Chạy cùng --env-file .env.prod; không chứa env inline bí mật.
name: musicque
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: musicque-api:latest
    container_name: music-order-api
    restart: always
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME required}
      BILLIARDS_AIM_BALL_IN_HAND_MS: ${BILLIARDS_AIM_BALL_IN_HAND_MS-}
      BILLIARDS_AIM_BREAK_MS: ${BILLIARDS_AIM_BREAK_MS-}
      BILLIARDS_AIM_MS: ${BILLIARDS_AIM_MS-}
      BILLIARDS_INTERMISSION_MS: ${BILLIARDS_INTERMISSION_MS-}
      BILLIARDS_MAX_BET: ${BILLIARDS_MAX_BET-}
      BILLIARDS_MIN_BET: ${BILLIARDS_MIN_BET-}
      BILLIARDS_MISS_CHANCE: ${BILLIARDS_MISS_CHANCE-}
      BILLIARDS_RETENTION_MS: ${BILLIARDS_RETENTION_MS-}
      BILLIARDS_SETTLE_MS: ${BILLIARDS_SETTLE_MS-}
      BILLIARDS_SETTLE_POT_MS: ${BILLIARDS_SETTLE_POT_MS-}
      BILLIARDS_WAIT_MS: ${BILLIARDS_WAIT_MS-}
      CHOHAN_BET_MS: ${CHOHAN_BET_MS-}
      CHOHAN_MAX_BET: ${CHOHAN_MAX_BET-}
      CHOHAN_MIN_BET: ${CHOHAN_MIN_BET-}
      CHOHAN_REVEAL_MS: ${CHOHAN_REVEAL_MS-}
      CHOHAN_SHAKE_MS: ${CHOHAN_SHAKE_MS-}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL required}
      DAILY_BONUS_PC: ${DAILY_BONUS_PC-}
      EDGE_TTS_ENABLED: ${EDGE_TTS_ENABLED-}
      EDGE_TTS_PITCH: ${EDGE_TTS_PITCH-}
      EDGE_TTS_RATE: ${EDGE_TTS_RATE-}
      EDGE_TTS_TIMEOUT: ${EDGE_TTS_TIMEOUT-}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE-}
      EDGE_TTS_VOLUME: ${EDGE_TTS_VOLUME-}
      JUNGLE_CLOCK_MS: ${JUNGLE_CLOCK_MS-}
      JUNGLE_DISCONNECT_MS: ${JUNGLE_DISCONNECT_MS-}
      JUNGLE_GAME_RETENTION_MS: ${JUNGLE_GAME_RETENTION_MS-}
      JUNGLE_REPETITION_LIMIT: ${JUNGLE_REPETITION_LIMIT-}
      JUNGLE_STAKE_PC: ${JUNGLE_STAKE_PC-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET-}
      LIVEKIT_URL: ${LIVEKIT_URL-}
      LOTTERY_CUTOFF_HOUR: ${LOTTERY_CUTOFF_HOUR-}
      LOTTERY_GIVEUP_HOUR: ${LOTTERY_GIVEUP_HOUR-}
      LOTTERY_MAX_STAKE: ${LOTTERY_MAX_STAKE-}
      LOTTERY_RETRY_MS: ${LOTTERY_RETRY_MS-}
      LOTTERY_RSS_URL: ${LOTTERY_RSS_URL-}
      LOTTERY_SETTLE_HOUR: ${LOTTERY_SETTLE_HOUR-}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI required}
      PORT: ${PORT:?PORT required}
      SIGNUP_START_BALANCE: ${SIGNUP_START_BALANCE-}
      SOCKET_URL: ${SOCKET_URL:?SOCKET_URL required}
      SONG_SKIP_PC_THRESHOLD: ${SONG_SKIP_PC_THRESHOLD-}
      SSO_ADMIN_URL: ${SSO_ADMIN_URL-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:?SSO_CLIENT_ID required}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:?SSO_CLIENT_SECRET required}
      SSO_HANDOFF_ORIGINS: ${SSO_HANDOFF_ORIGINS-}
      SSO_HANDOFF_TARGETS: ${SSO_HANDOFF_TARGETS-}
      SSO_ISSUER: ${SSO_ISSUER:?SSO_ISSUER required}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:?SSO_REDIRECT_URI required}
      SSO_TOKEN_KEY: ${SSO_TOKEN_KEY:?SSO_TOKEN_KEY required}
      SSO_WEB_ORIGIN: ${SSO_WEB_ORIGIN:?SSO_WEB_ORIGIN required}
      TZ: ${TZ-}
      VIENEU_TTS_CACHE_MAX_AGE_DAYS: ${VIENEU_TTS_CACHE_MAX_AGE_DAYS-}
      VIENEU_TTS_CACHE_MAX_FILES: ${VIENEU_TTS_CACHE_MAX_FILES-}
      VIENEU_TTS_CACHE_VERSION: ${VIENEU_TTS_CACHE_VERSION-}
      VIENEU_TTS_ENABLED: ${VIENEU_TTS_ENABLED-}
      VIENEU_TTS_HEALTH_TIMEOUT: ${VIENEU_TTS_HEALTH_TIMEOUT-}
      VIENEU_TTS_PRIMARY_TIMEOUT: ${VIENEU_TTS_PRIMARY_TIMEOUT-}
      VIENEU_TTS_QUEUE_MAX_SIZE: ${VIENEU_TTS_QUEUE_MAX_SIZE-}
      VIENEU_TTS_RATE_MAX_REQUESTS: ${VIENEU_TTS_RATE_MAX_REQUESTS-}
      VIENEU_TTS_RATE_WINDOW_MS: ${VIENEU_TTS_RATE_WINDOW_MS-}
      VIENEU_TTS_SPEECH_MAX_CHARS: ${VIENEU_TTS_SPEECH_MAX_CHARS-}
      VIENEU_TTS_SYNC_WAIT_MS: ${VIENEU_TTS_SYNC_WAIT_MS-}
      VIENEU_TTS_TIMEOUT: ${VIENEU_TTS_TIMEOUT-}
      VIENEU_TTS_URL: ${VIENEU_TTS_URL-}
      VIENEU_TTS_VOICE: ${VIENEU_TTS_VOICE-}
      VIENEU_TTS_WARM_QUEUE_CONCURRENCY: ${VIENEU_TTS_WARM_QUEUE_CONCURRENCY-}
      WC2026_API_KEY: ${WC2026_API_KEY-}
      WEATHER_API_KEY: ${WEATHER_API_KEY-}
      WEATHER_LOCATION: ${WEATHER_LOCATION-}
      WORDCHAIN_BETWEEN_ROUNDS_MS: ${WORDCHAIN_BETWEEN_ROUNDS_MS-}
      WORDCHAIN_BOT_ENABLED: ${WORDCHAIN_BOT_ENABLED-}
      WORDCHAIN_BOT_TRIGGER_MS: ${WORDCHAIN_BOT_TRIGGER_MS-}
      WORDCHAIN_DAILY_PAYOUT_CAP: ${WORDCHAIN_DAILY_PAYOUT_CAP-}
      WORDCHAIN_IDLE_MS: ${WORDCHAIN_IDLE_MS-}
      WORDCHAIN_ROUND_PAYOUT_CAP: ${WORDCHAIN_ROUND_PAYOUT_CAP-}
      WORDCHAIN_TURN_MS: ${WORDCHAIN_TURN_MS-}
      WORKSPACE_VOICE_ENABLED: ${WORKSPACE_VOICE_ENABLED-}
      XIANGQI_DAILY_REWARD_CAP: ${XIANGQI_DAILY_REWARD_CAP-}
      XIANGQI_ENGINE_JOB_TIMEOUT_MS: ${XIANGQI_ENGINE_JOB_TIMEOUT_MS-}
      XIANGQI_ENGINE_MAX_RETRIES: ${XIANGQI_ENGINE_MAX_RETRIES-}
      XIANGQI_ENGINE_MOVE_MS: ${XIANGQI_ENGINE_MOVE_MS-}
      XIANGQI_ENGINE_WORKERS: ${XIANGQI_ENGINE_WORKERS-}
      XIANGQI_RECENT_PUZZLES: ${XIANGQI_RECENT_PUZZLES-}
      XIANGQI_REWARD_EASY: ${XIANGQI_REWARD_EASY-}
      XIANGQI_REWARD_HARD: ${XIANGQI_REWARD_HARD-}
      XIANGQI_REWARD_MEDIUM: ${XIANGQI_REWARD_MEDIUM-}
      XIANGQI_STAKE_PC: ${XIANGQI_STAKE_PC-}
      XIANGQI_TIME_EASY_SECONDS: ${XIANGQI_TIME_EASY_SECONDS-}
      XIANGQI_TIME_HARD_SECONDS: ${XIANGQI_TIME_HARD_SECONDS-}
      XIANGQI_TIME_MEDIUM_SECONDS: ${XIANGQI_TIME_MEDIUM_SECONDS-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY-}
      NODE_ENV: ${NODE_ENV-}
      THIRTEEN_MAX_TABLES: ${THIRTEEN_MAX_TABLES-}
      THIRTEEN_READY_COUNTDOWN_MS: ${THIRTEEN_READY_COUNTDOWN_MS-}
      THIRTEEN_READY_TIMEOUT_MS: ${THIRTEEN_READY_TIMEOUT_MS-}
      THIRTEEN_IDLE_SEAT_MS: ${THIRTEEN_IDLE_SEAT_MS-}
      THIRTEEN_STAKE_PC: ${THIRTEEN_STAKE_PC-}
      THIRTEEN_TURN_MS: ${THIRTEEN_TURN_MS-}
      THIRTEEN_BOT_DELAY_MS: ${THIRTEEN_BOT_DELAY_MS-}
      SESSION_AUTO_END_HOUR: ${SESSION_AUTO_END_HOUR-}
    networks: [music-order-network]
    ports: ["5800:5000"]
    depends_on:
      mongodb: {condition: service_started}
      vieneu-tts: {condition: service_healthy}
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL required}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:?VITE_SOCKET_URL required}
    image: musicque-client:latest
    container_name: music-order-client
    restart: always
    environment:
      VITE_API_URL: ${VITE_API_URL:?VITE_API_URL required}
      VITE_RESPONSIVE_VOICE_KEY: ${VITE_RESPONSIVE_VOICE_KEY-}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:?VITE_SOCKET_URL required}
    networks: [music-order-network]
    ports: ["3800:80"]
    depends_on: [api]
  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    container_name: music-order-mongodb
    restart: "no"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD-}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME-}
    networks: [music-order-network]
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongodb_data:/data/db]
  vieneu-tts:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    container_name: music-order-vieneu-tts
    restart: always
    environment:
      EDGE_TTS_PITCH: ${EDGE_TTS_PITCH-}
      EDGE_TTS_RATE: ${EDGE_TTS_RATE-}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE-}
      EDGE_TTS_VOLUME: ${EDGE_TTS_VOLUME-}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS-}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS-}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS-}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS-}
      VIENEU_APPLY_WATERMARK: ${VIENEU_APPLY_WATERMARK-}
      VIENEU_HOST: ${VIENEU_HOST-}
      VIENEU_INFER_MAX_CHARS: ${VIENEU_INFER_MAX_CHARS-}
      VIENEU_INFER_MAX_NEW_FRAMES: ${VIENEU_INFER_MAX_NEW_FRAMES-}
      VIENEU_INFER_REPETITION_PENALTY: ${VIENEU_INFER_REPETITION_PENALTY-}
      VIENEU_INFER_TEMPERATURE: ${VIENEU_INFER_TEMPERATURE-}
      VIENEU_INFER_TOP_K: ${VIENEU_INFER_TOP_K-}
      VIENEU_INFER_TOP_P: ${VIENEU_INFER_TOP_P-}
      VIENEU_PORT: ${VIENEU_PORT-}
    networks: [music-order-network]
    ports: ["127.0.0.1:8100:8100"]
    volumes: [tts_models:/root/.cache/huggingface]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
networks:
  music-order-network:
    name: musicque_music-order-network
    driver: bridge
volumes:
  mongodb_data:
  tts_models:
